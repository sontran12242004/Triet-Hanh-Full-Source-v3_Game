<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triết Hành — Map & Animation</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101b21;color:#eef6f1;font:16px system-ui,sans-serif}main{max-width:1464px;margin:auto;padding:16px}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}h1{font-size:21px;margin:0 auto 0 0}select,button{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid #52655f;background:#22372f;color:inherit}label{display:flex;gap:8px;align-items:center}canvas{display:block;width:100%;height:auto;aspect-ratio:8/5;border-radius:12px;background:#1d3035}#status{font-size:14px;color:#b9cfc4}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #e9c67c;outline-offset:3px}</style>
<main><header><h1>Triết Hành · Map & Animation</h1><label>Map <select id="map" disabled></select></label><button id="pause" disabled>Tạm dừng</button><label><input id="motion" type="checkbox" disabled>Giảm chuyển động</label></header><canvas id="scene" width="1440" height="900" aria-label="Bản đồ có hiệu ứng chuyển động"></canvas><p id="status" role="status">Đang tải ảnh…</p></main>
<script type="module">
import {createMapScene,MAPS} from './map-scene.js';
const canvas=document.querySelector('#scene'),select=document.querySelector('#map'),pause=document.querySelector('#pause'),motion=document.querySelector('#motion'),status=document.querySelector('#status');
MAPS.forEach(m=>{const o=document.createElement('option');o.value=m.id;o.textContent=m.name;select.append(o);});
try{
 const scene=await createMapScene(canvas);let playing=true;motion.checked=scene.reducedMotion;select.disabled=pause.disabled=motion.disabled=false;
 select.onchange=()=>scene.setMap(select.value);motion.onchange=()=>scene.setReducedMotion(motion.checked);
 pause.onclick=()=>{playing=!playing;playing?scene.start():scene.stop();pause.textContent=playing?'Tạm dừng':'Tiếp tục';};
 status.textContent='6 map · Chỉ nền và hiệu ứng · Không kết nối database';
 window.addEventListener('pagehide',()=>scene.destroy(),{once:true});
}catch(error){status.textContent='Không tải được map: '+error.message;}
</script></html>
